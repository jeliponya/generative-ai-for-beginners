<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>TeslaPlay</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Giriş Ekranı ── */
    #input-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      width: 100%;
      max-width: 520px;
      padding: 32px 24px;
    }

    .logo {
      font-size: 28px;
      font-weight: 200;
      letter-spacing: 6px;
      color: #e82127;
    }

    .logo span { color: #fff; }

    .subtitle {
      font-size: 13px;
      color: #555;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    #url-input {
      width: 100%;
      padding: 15px 18px;
      font-size: 15px;
      background: #161616;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      color: #fff;
      outline: none;
      transition: border-color 0.2s;
    }
    #url-input::placeholder { color: #444; }
    #url-input:focus { border-color: #e82127; }

    #play-btn {
      width: 100%;
      padding: 15px;
      background: #e82127;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      letter-spacing: 0.5px;
    }
    #play-btn:hover:not(:disabled) { background: #c41c21; }
    #play-btn:active:not(:disabled) { transform: scale(0.98); }
    #play-btn:disabled { background: #2a2a2a; color: #555; cursor: not-allowed; }

    #status {
      font-size: 13px;
      color: #666;
      min-height: 18px;
      text-align: center;
    }
    #status.error { color: #e82127; }
    #status.info  { color: #4a9eff; }

    #dep-warning {
      font-size: 12px;
      color: #aa6600;
      background: #1a1100;
      border: 1px solid #332200;
      border-radius: 8px;
      padding: 10px 14px;
      display: none;
      width: 100%;
      line-height: 1.5;
    }

    /* ── Oynatıcı Ekranı ── */
    #player-screen {
      display: none;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      background: #000;
      position: fixed;
      top: 0; left: 0;
    }

    #canvas {
      flex: 1;
      width: 100%;
      display: block;
      background: #000;
      /* Canvas boyutu JS ile ayarlanıyor, CSS ile doldur */
      object-fit: contain;
    }

    #bottom-bar {
      display: flex;
      align-items: center;
      padding: 8px 16px;
      background: rgba(0,0,0,0.85);
      gap: 12px;
      height: 46px;
    }

    #back-btn {
      background: none;
      border: 1px solid #333;
      color: #ccc;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }
    #back-btn:hover { border-color: #666; color: #fff; }

    #loading-indicator {
      font-size: 13px;
      color: #555;
    }

    #fps-badge {
      margin-left: auto;
      font-size: 11px;
      color: #444;
      font-variant-numeric: tabular-nums;
    }

    /* Yükleniyor animasyonu */
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid #333;
      border-top-color: #e82127;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    audio { display: none; }
  </style>
</head>
<body>

  <!-- Giriş Ekranı -->
  <div id="input-screen">
    <div class="logo">TESLA<span>PLAY</span></div>
    <div class="subtitle">Canvas Video Oynatıcı</div>

    <div id="dep-warning"></div>

    <input
      id="url-input"
      type="url"
      placeholder="YouTube URL yapıştır..."
      autocomplete="off"
      autocorrect="off"
      spellcheck="false"
    />

    <button id="play-btn">▶ Oynat</button>
    <div id="status"></div>
  </div>

  <!-- Oynatıcı Ekranı -->
  <div id="player-screen">
    <canvas id="canvas"></canvas>
    <audio id="audio" autoplay></audio>
    <div id="bottom-bar">
      <button id="back-btn">← Geri</button>
      <span id="loading-indicator"></span>
      <span id="fps-badge"></span>
    </div>
  </div>

  <script src="player.js"></script>
</body>
</html>
